name: "1. Extract Audio & AI Subtitles (Gemini Speech-to-Sub)"

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: 'Video record ID in Neon DB'
        required: true
        type: string
      raw_file_name:
        description: 'Raw video filename in OneDrive /raw/ folder'
        required: false
        type: string
        default: ''
      model:
        description: 'Gemini Model Name (from GEMINI_MODEL_NAME in .env)'
        required: false
        type: string
        default: ''
      custom_prompt:
        description: 'Optional custom instructions for subtitle generation'
        required: false
        type: string
        default: ''

concurrency:
  group: audio-sub-vid-${{ inputs.video_id }}
  cancel-in-progress: true

jobs:
  extract-and-subtitle:
    name: "Audio & AI Subtitles #${{ inputs.video_id }} (${{ inputs.model || 'gemini-2.5-flash' }})"
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify FFmpeg
        run: |
          if ! command -v ffmpeg &> /dev/null; then
            sudo apt-get update -y && sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 2

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Minimal Worker Dependency (@neondatabase/serverless)
        run: |
          npm install --no-save --no-audit --no-fund @neondatabase/serverless

      - name: Run Audio Extraction & AI Subtitle Worker
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ONEDRIVE_USER_ID: ${{ secrets.ONEDRIVE_USER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
          GEMINI_MODEL_NAME: ${{ inputs.model || secrets.GEMINI_MODEL_NAME || vars.GEMINI_MODEL_NAME }}
          VIDEO_ID: ${{ inputs.video_id }}
          RAW_FILE_NAME: ${{ inputs.raw_file_name }}
          AI_MODEL: ${{ inputs.model || secrets.GEMINI_MODEL_NAME || vars.GEMINI_MODEL_NAME }}
          CUSTOM_PROMPT: ${{ inputs.custom_prompt }}
        run: |
          node scripts/audio-subtitle-worker.js
