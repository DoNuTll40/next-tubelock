name: "2. Detailed Sprite Sheet Grid & AI Content Rating (Gemini Vision)"

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: 'Video record ID in Neon DB'
        required: true
        type: string
      raw_file_name:
        description: 'Raw video filename in OneDrive /raw/ folder'
        required: false
        type: string
        default: ''
      user_rating:
        description: 'User-selected content rating (all, 13+, 18+, mature, or auto)'
        required: false
        type: string
        default: 'auto'
      auto_apply:
        description: 'Automatically apply AI rating & category/tags (true/false)'
        required: false
        type: string
        default: 'true'
      model:
        description: 'Gemini Model Name (from GEMINI_MODEL_NAME in .env)'
        required: false
        type: string
        default: ''

concurrency:
  group: sprite-rating-vid-${{ inputs.video_id }}
  cancel-in-progress: true

jobs:
  sprite-and-rating:
    name: "Sprite Grid & AI Content Rating #${{ inputs.video_id }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify FFmpeg
        run: |
          if ! command -v ffmpeg &> /dev/null; then
            sudo apt-get update -y && sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 2

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Minimal Worker Dependency (@neondatabase/serverless)
        run: |
          npm install --no-save --no-audit --no-fund @neondatabase/serverless

      - name: Run Detailed Sprite Sheet & Gemini Vision Content Rating Worker
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ONEDRIVE_USER_ID: ${{ secrets.ONEDRIVE_USER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
          GEMINI_MODEL_NAME: ${{ inputs.model || secrets.GEMINI_MODEL_NAME || vars.GEMINI_MODEL_NAME }}
          VIDEO_ID: ${{ inputs.video_id }}
          RAW_FILE_NAME: ${{ inputs.raw_file_name }}
          USER_RATING: ${{ inputs.user_rating }}
          AUTO_APPLY: ${{ inputs.auto_apply }}
        run: |
          node scripts/sprite-rating-worker.js
