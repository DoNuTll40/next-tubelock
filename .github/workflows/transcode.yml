name: "Transcode HLS Multi-bitrate (3x Parallel Ubuntu 4-Core / 16GB)"

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: 'Video record ID in Neon DB'
        required: true
        type: string
      raw_file_name:
        description: 'Raw video filename in OneDrive /raw/ folder'
        required: true
        type: string
      title:
        description: 'Title of the video'
        required: false
        type: string
        default: ''
      version_id:
        description: 'Optional video_versions record ID in Neon DB'
        required: false
        type: string
        default: ''

# ถ้ายิง video_id (+ version_id) เดิมซ้ำ ให้ยกเลิกอันเก่าทันที แต่ถ้าคนละเวอร์ชัน/คนละเรื่อง ให้รันขนานกันได้เลย
concurrency:
  group: transcode-vid-${{ inputs.video_id }}${{ inputs.version_id != '' && format('-v{0}', inputs.version_id) || '' }}
  cancel-in-progress: true

jobs:
  lane-fast-sd:
    name: "Lane 1/3 (Fast 144p + Storyboard + 360p/480p) #${{ inputs.video_id }}${{ inputs.version_id != '' && format(' v{0}', inputs.version_id) || '' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Worker Script
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free Disk Space (+30GB), Boost RAM Disk & Verify FFmpeg
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo mount -o remount,size=12G /dev/shm || true
          df -h / /dev/shm
          if ! ffmpeg -hide_banner -encoders 2>/dev/null | awk '$2 == "libsvtav1" {found=1} END {exit !found}'; then
            sudo apt-get update -y && sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 2
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -E "libx264|libsvtav1" | head -n 4 || true

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Minimal Worker Dependency (@neondatabase/serverless)
        run: |
          npm install --no-save --no-audit --no-fund @neondatabase/serverless

      - name: Run HLS Lane 1 (Fast Unlock 144p + Storyboard + 360p/480p)
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ONEDRIVE_USER_ID: ${{ secrets.ONEDRIVE_USER_ID }}
          VIDEO_ID: ${{ inputs.video_id }}
          VERSION_ID: ${{ inputs.version_id }}
          RAW_FILE_NAME: ${{ inputs.raw_file_name }}
          VIDEO_TITLE: ${{ inputs.title }}
          TRANSCODE_LANE: "fast_sd"
          TRANSCODE_RUN_ID: "${{ github.run_id }}"
        run: |
          node scripts/transcode-worker.js

  lane-hd:
    name: "Lane 2/3 (720p HD + 1440p 2K) #${{ inputs.video_id }}${{ inputs.version_id != '' && format(' v{0}', inputs.version_id) || '' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Worker Script
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free Disk Space (+30GB), Boost RAM Disk & Verify FFmpeg
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo mount -o remount,size=12G /dev/shm || true
          df -h / /dev/shm
          if ! ffmpeg -hide_banner -encoders 2>/dev/null | awk '$2 == "libsvtav1" {found=1} END {exit !found}'; then
            sudo apt-get update -y && sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 2
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -E "libx264|libsvtav1" | head -n 4 || true

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Minimal Worker Dependency (@neondatabase/serverless)
        run: |
          npm install --no-save --no-audit --no-fund @neondatabase/serverless

      - name: Run HLS Lane 2 (720p HD + 1440p 2K)
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ONEDRIVE_USER_ID: ${{ secrets.ONEDRIVE_USER_ID }}
          VIDEO_ID: ${{ inputs.video_id }}
          VERSION_ID: ${{ inputs.version_id }}
          RAW_FILE_NAME: ${{ inputs.raw_file_name }}
          VIDEO_TITLE: ${{ inputs.title }}
          TRANSCODE_LANE: "hd"
          TRANSCODE_RUN_ID: "${{ github.run_id }}"
        run: |
          node scripts/transcode-worker.js

  lane-fhd:
    name: "Lane 3/3 (1080p FHD + 2160p 4K) #${{ inputs.video_id }}${{ inputs.version_id != '' && format(' v{0}', inputs.version_id) || '' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Worker Script
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free Disk Space (+30GB), Boost RAM Disk & Verify FFmpeg
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo mount -o remount,size=12G /dev/shm || true
          df -h / /dev/shm
          if ! ffmpeg -hide_banner -encoders 2>/dev/null | awk '$2 == "libsvtav1" {found=1} END {exit !found}'; then
            sudo apt-get update -y && sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 2
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -E "libx264|libsvtav1" | head -n 4 || true

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Minimal Worker Dependency (@neondatabase/serverless)
        run: |
          npm install --no-save --no-audit --no-fund @neondatabase/serverless

      - name: Run HLS Lane 3 (1080p Full HD + 2160p 4K)
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ONEDRIVE_USER_ID: ${{ secrets.ONEDRIVE_USER_ID }}
          VIDEO_ID: ${{ inputs.video_id }}
          VERSION_ID: ${{ inputs.version_id }}
          RAW_FILE_NAME: ${{ inputs.raw_file_name }}
          VIDEO_TITLE: ${{ inputs.title }}
          TRANSCODE_LANE: "fhd"
          TRANSCODE_RUN_ID: "${{ github.run_id }}"
        run: |
          node scripts/transcode-worker.js

  finalize:
    name: "Finalize HLS & Cleanup #${{ inputs.video_id }}${{ inputs.version_id != '' && format(' v{0}', inputs.version_id) || '' }}"
    needs: [lane-fast-sd, lane-hd, lane-fhd]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Worker Script
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Minimal Worker Dependency (@neondatabase/serverless)
        run: |
          npm install --no-save --no-audit --no-fund @neondatabase/serverless

      - name: Finalize Master Playlist, DB Status & Raw Cleanup
        env:
          NODE_OPTIONS: "--max-old-space-size=2048"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ONEDRIVE_USER_ID: ${{ secrets.ONEDRIVE_USER_ID }}
          VIDEO_ID: ${{ inputs.video_id }}
          VERSION_ID: ${{ inputs.version_id }}
          RAW_FILE_NAME: ${{ inputs.raw_file_name }}
          VIDEO_TITLE: ${{ inputs.title }}
          TRANSCODE_LANE: "finalize"
          TRANSCODE_RUN_ID: "${{ github.run_id }}"
          LANE_FAST_SD_RESULT: ${{ needs.lane-fast-sd.result }}
          LANE_HD_RESULT: ${{ needs.lane-hd.result }}
          LANE_FHD_RESULT: ${{ needs.lane-fhd.result }}
        run: |
          node scripts/transcode-worker.js
