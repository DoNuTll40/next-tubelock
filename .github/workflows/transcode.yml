name: "Transcode HLS Multi-bitrate (Ubuntu 4-Core / 16GB)"

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: 'Video record ID in Neon DB'
        required: true
        type: string
      raw_file_name:
        description: 'Raw video filename in OneDrive /raw/ folder'
        required: true
        type: string
      title:
        description: 'Title of the video'
        required: false
        type: string
        default: ''

# ถ้ายิง video_id เดิมซ้ำ ให้ยกเลิกอันเก่าทันที แต่ถ้าคนละ video_id ให้รันขนานกันได้เลย
concurrency:
  group: transcode-vid-${{ inputs.video_id }}
  cancel-in-progress: true

jobs:
  transcode:
    name: "Transcode Video #${{ inputs.video_id }} (4-Core / 12GB RAM Disk)"
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout Worker Script Only (Ultra-Fast Sparse Checkout)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Boost RAM Disk (/dev/shm -> 12GB) & Verify FFmpeg
        run: |
          # ขยาย RAM Disk เป็น 12GB เพื่อให้ FFmpeg หั่นไฟล์ .ts บน RAM ได้เต็มสปีด
          sudo mount -o remount,size=12G /dev/shm || true
          df -h /dev/shm
          # เช็ก FFmpeg ที่ติดมากับ Ubuntu Runner (ถ้าไม่มีค่อยลงใหม่)
          if ! command -v ffmpeg &> /dev/null; then
            sudo apt-get update -y && sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 2

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Minimal Worker Dependency (@neondatabase/serverless)
        run: |
          # ลงเฉพาะไลบรารีที่ transcode-worker.js ใช้จริง (เสร็จใน 2 วินาที ไม่ต้องแบก Next.js ทั้งก้อน)
          npm install --no-save --no-audit --no-fund @neondatabase/serverless

      - name: Run High-Performance Transcode Worker
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ONEDRIVE_USER_ID: ${{ secrets.ONEDRIVE_USER_ID }}
          VIDEO_ID: ${{ inputs.video_id }}
          RAW_FILE_NAME: ${{ inputs.raw_file_name }}
          VIDEO_TITLE: ${{ inputs.title }}
        run: |
          node scripts/transcode-worker.js