name: Benchmark AV1 HLS

on:
  workflow_dispatch:
    inputs:
      source_file:
        description: 'OneDrive filename or path relative to My files, e.g. raw/video.mp4'
        type: string
        required: true
        default: 'ด้วยความคิดถึง - Drama Stream ｜ Cover by โจอี้ ภูวศิษฐ์.mp4'
      sample_seconds:
        description: 'Seconds from start. Set 0 for the entire source.'
        type: number
        default: 0

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Check FFmpeg and prepare RAM disk
        run: |
          sudo mount -o remount,size=12G /dev/shm || true
          df -h /dev/shm
          lscpu | awk '/^CPU\(s\):|^Model name:/'
          if ! ffmpeg -hide_banner -encoders 2>/dev/null | awk '$2 == "libsvtav1" {found=1} END {exit !found}'; then
            sudo apt-get update -q
            sudo apt-get install -qy ffmpeg
          fi
          ffmpeg -version | sed -n '1p'
          ffmpeg -hide_banner -encoders 2>/dev/null | awk '$2 == "libsvtav1" {found=1} END {exit !found}'

      - name: Download test source
        env:
          SOURCE_FILE: ${{ inputs.source_file }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ONEDRIVE_USER_ID: ${{ secrets.ONEDRIVE_USER_ID }}
        run: time node scripts/download-benchmark-source.mjs "$RUNNER_TEMP/av1-source"

      - name: Encode AV1 HLS renditions
        env:
          SAMPLE_SECONDS: ${{ inputs.sample_seconds }}
        run: |
          source="$RUNNER_TEMP/av1-source"
          scratch="$RUNNER_TEMP"
          source_bytes=$(stat -c %s "$source")
          shm_bytes=$(df -B1 --output=avail /dev/shm | tail -n 1)
          if (( shm_bytes * 10 > source_bytes * 22 )); then
            scratch=/dev/shm
            mv "$source" "$scratch/av1-source"
            source="$scratch/av1-source"
          fi
          echo "Encoding workspace: $scratch"
          node scripts/benchmark-av1-hls.mjs "$source" "$SAMPLE_SECONDS" "$scratch"
